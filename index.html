    <style>
:root {
  --paper: #e9f1ee;
  --surface: rgba(255,255,255,.76);
  --ink: #1e302a;
  --muted: #62746e;
  --line: rgba(255,255,255,.72);
  --accent: #286b58;
  --accent-soft: rgba(93,174,145,.15);
  --coral: #c76452;
  --coral-soft: rgba(220,119,101,.13);
  --sun: #e6b84d;
  --radius: 24px;
  --shadow: 0 18px 42px rgba(37,79,67,.11);
  --glass: rgba(255,255,255,.57);
  --glass-strong: rgba(255,255,255,.82);
  --glass-stroke: rgba(255,255,255,.75);
  --field: rgba(255,255,255,.62);
  --hover: rgba(255,255,255,.42);
  --track: rgba(34,96,75,.10);
  --sidebar-glass: rgba(246,252,248,.62);
  --nav-glass: rgba(248,253,250,.72);
  --hero-start: #277c69;
  --hero-end: #17483f;
  --ambient-one: rgba(156,224,195,.66);
  --ambient-two: rgba(173,202,251,.52);
  --ambient-three: rgba(244,202,184,.38);
  font-family: "DM Sans", system-ui, sans-serif;
  color: var(--ink);
  background: var(--paper);
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0c1720;
  --surface: rgba(25,41,52,.84);
  --ink: #eef8f5;
  --muted: #acc2bc;
  --line: rgba(199,236,228,.12);
  --accent: #8ae3bf;
  --accent-soft: rgba(103,217,177,.18);
  --coral: #ffab9b;
  --coral-soft: rgba(255,156,138,.14);
  --sun: #f4c96c;
  --shadow: 0 22px 52px rgba(0,0,0,.28);
  --glass: rgba(31,50,62,.67);
  --glass-strong: rgba(31,49,60,.93);
  --glass-stroke: rgba(208,244,236,.17);
  --field: rgba(15,32,43,.74);
  --hover: rgba(166,231,209,.09);
  --track: rgba(209,239,229,.12);
  --sidebar-glass: rgba(15,31,42,.76);
  --nav-glass: rgba(24,44,56,.86);
  --hero-start: #266f69;
  --hero-end: #15344c;
  --ambient-one: rgba(29,113,99,.34);
  --ambient-two: rgba(57,83,164,.32);
  --ambient-three: rgba(115,66,95,.23);
}

* { box-sizing: border-box; }
html { min-height: 100%; background: var(--paper); }
body { min-height: 100%; margin: 0; background: radial-gradient(circle at 10% 2%, var(--ambient-one), transparent 34%), radial-gradient(circle at 90% 13%, var(--ambient-two), transparent 34%), radial-gradient(circle at 55% 96%, var(--ambient-three), transparent 40%), var(--paper); }
button, input, select { font: inherit; }
button { color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid rgba(56,90,71,.25); outline-offset: 2px; }
button:disabled { cursor: default; opacity: .48; }
[hidden] { display: none !important; }

.app-shell { min-height: 100vh; display: flex; }
.sidebar { position: fixed; z-index: 5; inset: 0 auto 0 0; width: 236px; display: flex; flex-direction: column; padding: 32px 18px 24px; background: #fbfbf9; border-right: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 12px 32px; color: var(--ink); text-decoration: none; font: 700 24px/1 "Playfair Display", serif; letter-spacing: -.8px; }
.brand-mark, .welcome-orb { display: grid; place-items: center; color: white; background: var(--accent); border-radius: 50%; font: 700 25px/1 "Playfair Display", serif; width: 30px; height: 30px; }
.nav-list { display: grid; gap: 5px; }
.nav-item, .bottom-nav-item { display: flex; align-items: center; border: 0; color: var(--muted); background: none; text-align: left; transition: color .18s ease, background .18s ease; }
.nav-item { gap: 13px; padding: 11px 12px; border-radius: 10px; font-size: 14px; font-weight: 600; }
.nav-item span { width: 18px; font-size: 20px; line-height: 1; font-weight: 400; text-align: center; }
.nav-item:hover, .nav-item.active { color: var(--accent); background: var(--accent-soft); }
.sidebar-foot { margin-top: auto; padding: 0 12px; }
.sidebar-foot p { margin: 18px 0 0; color: #949991; font-size: 11px; line-height: 1.55; }
.text-button { border: 0; padding: 6px 0; background: none; color: var(--muted); font-size: 12px; font-weight: 600; }
.text-button:hover { color: var(--accent); }

.main-content { width: min(100% - 236px, 1240px); margin-left: 236px; padding: 0 54px 64px; }
.topbar { height: 84px; display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
.mobile-brand { display: none; }
.month-control { margin-right: auto; border: 0; padding: 8px 0; background: none; color: var(--muted); font-size: 13px; font-weight: 600; }
.month-control::after { content: "⌄"; display: inline-block; margin-left: 7px; font-size: 14px; transform: translateY(-1px); }
.icon-button { width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); color: var(--muted); transition: transform .2s, color .2s; }
.icon-button:hover { color: var(--accent); transform: rotate(20deg); }
.page { display: none; max-width: 1080px; margin: 0 auto; animation: page-in .3s ease both; }
.page.active-page { display: block; }
@keyframes page-in { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }

.page-heading { margin: 12px 0 26px; }
.eyebrow { margin: 0 0 7px; color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
h1, h2, h3, p { margin-top: 0; }
.page-heading h1, .welcome-card h1 { margin-bottom: 0; font: 600 clamp(32px, 4vw, 44px)/1.06 "Playfair Display", Georgia, serif; letter-spacing: -1.8px; }
.page-heading h1 em, .welcome-card h1 em { color: var(--accent); font-weight: 600; }
.page-heading h1 .today { color: var(--muted); font-size: .66em; font-style: normal; letter-spacing: -1px; }
.section-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 15px; }
.section-heading h2 { margin: 0; font: 600 21px/1.15 "Playfair Display", Georgia, serif; letter-spacing: -.6px; }
.section-actions { display: flex; align-items: center; gap: 12px; }
.section-heading .subtle-link { flex: none; }
.subtle-link { padding: 4px 0; border: 0; background: none; color: var(--accent); font-size: 12px; font-weight: 700; }
.subtle-link:hover { text-decoration: underline; }
.muted { color: var(--muted); }
.helper { color: var(--muted); font-size: 12px; line-height: 1.45; }

.balance-card { position: relative; overflow: hidden; padding: 29px 31px 27px; border-radius: 24px; color: #fbfbf8; background: var(--accent); box-shadow: 0 16px 38px rgba(38,71,51,.16); }
.balance-card::before, .balance-card::after { position: absolute; z-index: 0; content: ""; border: 1px solid rgba(255,255,255,.11); border-radius: 50%; pointer-events: none; }
.balance-card::before { width: 330px; height: 330px; right: -158px; top: -245px; }
.balance-card::after { width: 160px; height: 160px; right: -34px; bottom: -118px; }
.balance-card > * { position: relative; z-index: 1; }
.balance-card .eyebrow { color: rgba(255,255,255,.69); }
.balance-amount { margin: 0 0 26px; font-size: clamp(43px, 6vw, 62px); line-height: .94; letter-spacing: -3px; font-weight: 600; }
.balance-amount.bump { animation: balance-bump .52s ease; }
@keyframes balance-bump { 50% { transform: translateY(-3px) scale(1.025); } }
.balance-foot { display: flex; flex-wrap: wrap; gap: 14px 25px; }
.balance-stat { display: grid; gap: 3px; font-size: 13px; }
.balance-stat small { color: rgba(255,255,255,.68); font-size: 11px; }
.balance-stat.negative b { color: #f8c8bd; }

.quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 35px; }
.action-button { min-height: 57px; display: flex; align-items: center; justify-content: center; gap: 9px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: 0 4px 14px rgba(20,30,25,.02); font-size: 13px; font-weight: 700; transition: transform .18s, box-shadow .18s; }
.action-button:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.action-button:active, .primary-button:active, .quick-add:active { transform: translateY(0) scale(.98); }
.action-button.income { color: var(--accent); }
.action-button.expense { color: var(--coral); }
.action-symbol { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; color: white; background: currentColor; font-size: 17px; line-height: 1; }
.action-symbol > span { filter: brightness(0) invert(1); }

.home-grid { display: grid; grid-template-columns: 1.03fr .97fr; gap: 30px; }
.transaction-list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.transaction-row { position: relative; display: flex; align-items: center; gap: 12px; min-height: 66px; padding: 10px 16px; border-bottom: 1px solid #f0f1ed; transition: background .16s, transform .2s, opacity .2s; }
.transaction-row:last-child { border-bottom: 0; }
.transaction-row:hover { background: #fcfcfa; }
.transaction-row.removing { opacity: 0; transform: translateX(8px); }
.transaction-row.just-added { animation: transaction-arrive .44s cubic-bezier(.2,.8,.2,1); }
@keyframes transaction-arrive { 0% { opacity: 0; transform: translateY(-8px); background: var(--accent-soft); } 65% { background: var(--accent-soft); } 100% { opacity: 1; transform: none; background: transparent; } }
.transaction-icon { width: 37px; height: 37px; flex: none; display: grid; place-items: center; border-radius: 12px; background: #f3f4f0; font-size: 18px; }
.transaction-icon.income { background: var(--accent-soft); color: var(--accent); font-size: 19px; }
.transaction-info { min-width: 0; flex: 1; }
.transaction-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 700; }
.transaction-meta { margin-top: 3px; color: var(--muted); font-size: 11px; }
.transaction-value { white-space: nowrap; font-size: 13px; font-weight: 700; }
.transaction-value.income { color: var(--accent); }
.transaction-value.expense { color: var(--coral); }
.row-actions { display: flex; gap: 2px; opacity: 0; transition: opacity .16s; }
.transaction-row:hover .row-actions, .transaction-row:focus-within .row-actions { opacity: 1; }
.mini-icon { display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 7px; color: var(--muted); background: transparent; font-size: 14px; }
.mini-icon:hover { color: var(--accent); background: var(--accent-soft); }
.mini-icon.delete:hover { color: var(--coral); background: var(--coral-soft); }

.insight-card, .report-card, .savings-card { padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.insight-card { margin-bottom: 18px; }
.insight-card .insight-copy { margin: 1px 0 18px; font: 600 21px/1.2 "Playfair Display", Georgia, serif; letter-spacing: -.5px; }
.category-chip-list { display: flex; flex-wrap: wrap; gap: 7px; }
.category-chip { padding: 7px 9px; border-radius: 9px; color: #48564a; background: #f2f4f0; font-size: 11px; font-weight: 700; }
.small-stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--line); }
.small-stat { padding: 17px 14px; background: var(--surface); }
.small-stat b { display: block; margin-top: 7px; font-size: 17px; letter-spacing: -.6px; }
.small-stat span { color: var(--muted); font-size: 10px; font-weight: 600; }
.empty-state { display: grid; place-items: center; min-height: 150px; padding: 24px; color: var(--muted); text-align: center; font-size: 13px; }
.empty-state .empty-icon { margin-bottom: 7px; font-size: 27px; }
.budget-glance { display: grid; grid-template-columns: 1fr auto; gap: 10px 15px; align-items: center; margin: 0 0 14px; padding: 15px 16px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface); }
.budget-glance.is-empty { border-style: dashed; }
.budget-glance span { display: block; margin-bottom: 4px; color: var(--muted); font-size: 10px; font-weight: 700; }
.budget-glance b { display: block; color: var(--accent); font-size: 13px; letter-spacing: -.2px; }
.budget-glance .progress-track { grid-column: 1 / -1; }
.journal-savings { margin: -18px 0 23px; color: var(--accent); font-size: 11px; font-weight: 700; }

.journal-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 29px; }
.metric-card { padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.metric-card span { display: block; margin-bottom: 7px; color: var(--muted); font-size: 11px; font-weight: 600; }
.metric-card b { font-size: 18px; letter-spacing: -.7px; }
.metric-card b.positive { color: var(--accent); }
.metric-card b.negative { color: var(--coral); }
.journal-date { margin: 0 0 9px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .1em; }

.month-switcher { display: inline-flex; align-items: center; gap: 5px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.month-switcher button { width: 29px; height: 29px; padding: 0; border: 0; border-radius: 7px; background: none; color: var(--muted); font-size: 17px; }
.month-switcher button:hover { background: var(--accent-soft); color: var(--accent); }
.month-switcher span { min-width: 126px; text-align: center; font-size: 12px; font-weight: 700; }
.summary-totals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 30px; }
.summary-total { padding: 19px 18px; border-radius: 15px; background: var(--surface); border: 1px solid var(--line); }
.summary-total:first-child { background: var(--accent-soft); border-color: transparent; }
.summary-total span { display: block; margin-bottom: 7px; color: var(--muted); font-size: 11px; font-weight: 600; }
.summary-total b { font-size: 22px; letter-spacing: -1px; }
.summary-total .expense-number { color: var(--coral); }
.summary-layout { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(250px, .75fr); gap: 25px; }
.category-bars { padding: 21px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.category-bar { margin-top: 18px; }
.category-bar-button { width: 100%; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; }
.category-bar-button:hover .category-bar-head b { color: var(--accent); }
.category-bar-button:hover .bar-fill { filter: brightness(.9); }
.category-bar:first-of-type { margin-top: 20px; }
.category-bar-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; font-size: 12px; font-weight: 700; }
.category-bar-head span { color: var(--muted); }
.bar-track { height: 7px; overflow: hidden; border-radius: 100px; background: #edf0ea; }
.bar-fill { height: 100%; min-width: 3px; border-radius: inherit; background: var(--accent); transform-origin: left; animation: fill-bar .7s cubic-bezier(.2,.8,.2,1) both; }
@keyframes fill-bar { from { transform: scaleX(0); } }
.report-card { align-self: start; }
.report-card h3, .savings-card h3 { margin: 0 0 9px; font: 600 19px/1.1 "Playfair Display", Georgia, serif; letter-spacing: -.5px; }
.report-line { display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
.report-line:last-of-type { border-bottom: 0; }
.report-line span { color: var(--muted); }
.top-categories { margin: 13px 0 0; padding-left: 19px; color: var(--accent); font-size: 13px; font-weight: 700; line-height: 1.9; }
.donut-summary { display: flex; align-items: center; gap: 16px; margin: 14px 0 16px; }
.donut-chart { width: 104px; aspect-ratio: 1; flex: none; display: grid; place-content: center; border-radius: 50%; position: relative; text-align: center; }
.donut-chart::after { content: ""; position: absolute; inset: 16px; z-index: 0; border-radius: inherit; background: var(--surface); }
.donut-chart span, .donut-chart small { position: relative; z-index: 1; display: block; }
.donut-chart span { font-size: 12px; font-weight: 800; letter-spacing: -.3px; }
.donut-chart small { margin-top: 2px; color: var(--muted); font-size: 9px; font-weight: 700; }
.donut-legend { display: grid; gap: 7px; min-width: 0; }
.donut-legend span { overflow: hidden; color: var(--muted); font-size: 10px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
.donut-legend i { width: 7px; height: 7px; display: inline-block; margin-right: 6px; border-radius: 50%; }
.summary-insight { margin: 0 0 9px; color: var(--ink); font-size: 12px; font-weight: 700; line-height: 1.45; }
.comparison { margin: 0 0 16px; color: var(--muted); font-size: 11px; line-height: 1.45; }
.comparison.is-up { color: #9b594a; }
.comparison.is-down { color: var(--accent); }

.budget-layout { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 28px; align-items: start; }
.budget-overview { display: grid; grid-template-columns: minmax(0, 1.35fr) repeat(2, minmax(145px, .65fr)); gap: 1px; margin: 0 0 27px; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--line); }
.budget-overview-main, .budget-overview-stat { min-height: 126px; padding: 19px; background: var(--surface); }
.budget-overview-main { background: var(--accent-soft); }
.budget-overview span { display: block; margin-bottom: 8px; color: var(--muted); font-size: 10px; font-weight: 700; }
.budget-overview b { display: block; color: var(--accent); font: 600 27px/1 "Playfair Display", Georgia, serif; letter-spacing: -1px; }
.budget-overview b.negative { color: var(--coral); }
.budget-overview p { margin: 9px 0 10px; color: #566456; font-size: 11px; line-height: 1.35; }
.budget-overview-stat { display: grid; align-content: start; }
.budget-overview-stat b { color: var(--ink); font-size: 22px; }
.budget-overview-stat small { margin-top: 8px; color: var(--muted); font-size: 10px; line-height: 1.35; }
.budget-overview-empty { min-height: 126px; display: flex; grid-column: 1 / -1; align-items: center; justify-content: space-between; gap: 22px; padding: 21px; background: var(--surface); }
.budget-overview-empty b { max-width: 460px; font-size: 18px; }
.budget-overview-empty p { margin: 7px 0 0; }
.budget-list { display: grid; gap: 10px; }
.budget-row { padding: 16px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface); }
.budget-row-top { display: flex; align-items: center; gap: 10px; }
.budget-row .category-name { flex: 1; font-size: 13px; font-weight: 700; }
.budget-row .category-name small { display: block; margin-top: 2px; color: var(--muted); font-size: 9px; font-weight: 600; }
.budget-row .budget-amount { width: 92px; border: 0; border-bottom: 1px solid var(--line); padding: 4px 0; background: none; text-align: right; color: var(--ink); font-size: 12px; font-weight: 700; }
.budget-row .budget-amount:focus { border-color: var(--accent); outline: 0; }
.budget-row .budget-amount::placeholder { color: #a5aaa4; }
.budget-row-bottom { display: flex; justify-content: space-between; gap: 8px; margin: 11px 0 7px; color: var(--muted); font-size: 11px; }
.budget-row-bottom .over { color: var(--coral); font-weight: 700; }
.progress-track { height: 6px; overflow: hidden; border-radius: 99px; background: #edf0ea; }
.progress-fill { height: 100%; max-width: 100%; border-radius: inherit; background: var(--accent); transition: width .3s; }
.progress-fill.close { background: var(--sun); }
.progress-fill.over { background: var(--coral); }
.reset-budget { margin: 11px 0 0; padding: 0; border: 0; color: var(--muted); background: none; font-size: 10px; font-weight: 700; }
.reset-budget:hover { color: var(--accent); text-decoration: underline; }
.budget-side { display: grid; gap: 17px; }
.savings-number { margin: 12px 0 10px; color: var(--accent); font: 600 29px/1 "Playfair Display", Georgia, serif; letter-spacing: -1px; }
.savings-card .settings-form { margin-top: 15px; }
.fixed-list { display: grid; gap: 8px; }
.fixed-summary { display: flex; align-items: center; justify-content: space-between; gap: 9px; margin: 2px 0 8px; padding: 9px 10px; border-radius: 9px; color: var(--muted); background: #f4f5f1; font-size: 10px; font-weight: 700; }
.fixed-summary b { color: var(--accent); }
.fixed-row { display: flex; align-items: center; gap: 9px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.fixed-row:last-child { border-bottom: 0; }
.fixed-main { flex: 1; min-width: 0; }
.fixed-main b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.fixed-main span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
.fixed-amount { font-size: 12px; font-weight: 700; }
.fixed-actions { display: flex; gap: 2px; }
.pay-button { padding: 6px 7px; border: 0; border-radius: 7px; color: var(--accent); background: var(--accent-soft); font-size: 10px; font-weight: 700; }
.pay-button:hover { filter: brightness(.97); }

.history-tools { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 19px; }

<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'clair-money-v1';
  const THEME_KEY = 'clair-theme-v1';
  const THEMES = ['light', 'dark', 'system'];
  const CATEGORIES = [
    { id: 'alimentation', icon: '🍔', label: 'Alimentation', keywords: ['crous', 'resto', 'restaurant', 'café', 'cafe', 'pain', 'poulet', 'course', 'courses', 'boisson', 'supermarché', 'supermarche', 'carrefour', 'lidl'] },

    { id: 'telephone', icon: '📱', label: 'Téléphone', keywords: ['téléphone', 'telephone', 'forfait', 'orange', 'sfr', 'free mobile'] },
    { id: 'etudes', icon: '🎓', label: 'Études', keywords: ['livre', 'cours', 'crous', 'impression', 'impressions', 'université', 'universite'] },
    { id: 'hygiene', icon: '🧴', label: 'Hygiène', keywords: ['shampoing', 'hygiène', 'hygiene', 'savon', 'pharmacie'] },
    { id: 'vetements', icon: '👕', label: 'Vêtements', keywords: ['vêtement', 'vetement', 'zara', 'friperie', 'chaussure'] },
    { id: 'famille', icon: '👨‍👩‍👦', label: 'Famille', keywords: ['parents', 'famille', 'cadeau'] },
    { id: 'loisirs', icon: '🎮', label: 'Loisirs', keywords: ['cinéma', 'cinema', 'netflix', 'sortie', 'jeu', 'spotify'] },
    { id: 'abonnements', icon: '💳', label: 'Abonnements', keywords: ['abonnement', 'netflix', 'spotify', 'icloud', 'prime'] },
    { id: 'epargne', icon: '💰', label: 'Épargne', keywords: ['épargne', 'epargne', 'livret'] },
    { id: 'imprevus', icon: '⚠️', label: 'Imprévus', keywords: ['réparation', 'reparation', 'amende', 'urgence'] },
    { id: 'autre', icon: '📦', label: 'Autre', keywords: [] }
  ];
  const INCOME_SOURCES = ['Salaire', 'Parents', 'Bourse', 'Aide', 'Autre'];
  const CHART_COLORS = ['#385a47', '#91ad97', '#e3b64e', '#c76452', '#8b9b8d'];
  const PAGES = ['accueil', 'journal', 'resume', 'budget', 'historique'];

  const $ = (selector, scope = document) => scope.querySelector(selector);
  const $$ = (selector, scope = document) => [...scope.querySelectorAll(selector)];
  const today = () => toISODate(new Date());
  const nowTime = () => new Intl.DateTimeFormat('fr-FR', { hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date());
  const pad = value => String(value).padStart(2, '0');
  const toISODate = date => `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
  const monthKey = (date = new Date()) => `${date.getFullYear()}-${pad(date.getMonth() + 1)}`;
  const dateFromISO = iso => {
    const [year, month, day] = String(iso || today()).split('-').map(Number);
    return new Date(year || new Date().getFullYear(), (month || 1) - 1, day || 1, 12);
  };
  const money = value => new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(Number(value || 0));
  const formatMonth = value => new Intl.DateTimeFormat('fr-FR', { month: 'long', year: 'numeric' }).format(dateFromISO(`${value}-01`));
  const formatToday = () => {
    const output = new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(new Date());
    return output[0].toUpperCase() + output.slice(1);
  };
  const formatDate = iso => new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'short' }).format(dateFromISO(iso));
  const formatFullDate = iso => new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }).format(dateFromISO(iso));
  const formatDayHeading = iso => new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }).format(dateFromISO(iso)).toUpperCase();
  const escapeHtml = string => String(string ?? '').replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);
  const numberValue = value => {
    const clean = String(value ?? '').trim().replace(/\s/g, '').replace(',', '.').replace(/[^0-9.-]/g, '');
    const number = Number(clean);
    return Number.isFinite(number) ? Math.round(number * 100) / 100 : 0;
  };
  const uid = prefix => `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;

  const emptyData = () => ({
    version: 2,
    initialized: false,
    openingBalance: 0,
    openingBalanceDate: null,
    transactions: [],
    customCategories: [],
    budgets: {},
    budgetOverrides: {},
    fixedExpenses: [],
    savingsGoal: 0,
    quickEntry: { lastExpenseCategory: 'alimentation', lastIncomeSource: '' }
  });

  function normalizeData(input) {
    const base = emptyData();
    const source = input && typeof input === 'object' ? input : {};
    let transactions = Array.isArray(source.transactions) ? source.transactions : [];
    const fixedExpenses = Array.isArray(source.fixedExpenses) ? source.fixedExpenses : [];
    const customCategories = Array.isArray(source.customCategories) ? source.customCategories : [];
    let openingBalance = Math.max(0, numberValue(source.openingBalance));
    let openingBalanceDate = /^\d{4}-\d{2}-\d{2}$/.test(source.openingBalanceDate || '') ? source.openingBalanceDate : null;
    if (source.openingBalance === undefined) {
      const legacyOpeningIndex = transactions.findIndex(item => item?.type === 'income' && item?.name === 'Solde de départ' && !item?.note);
      if (legacyOpeningIndex >= 0) {
        openingBalance = Math.max(0, numberValue(transactions[legacyOpeningIndex].amount));
        openingBalanceDate = transactions[legacyOpeningIndex].date || null;
        transactions = transactions.filter((_, index) => index !== legacyOpeningIndex);
      }
    }
    const usedTransactionIds = new Set();
    const normalizedOverrides = Object.entries(source.budgetOverrides && typeof source.budgetOverrides === 'object' ? source.budgetOverrides : {})
      .filter(([month]) => /^\d{4}-\d{2}$/.test(month))
      .reduce((all, [month, values]) => {
        if (!values || typeof values !== 'object') return all;
        const clean = Object.entries(values).reduce((result, [categoryId, amount]) => {
          const value = numberValue(amount);
          if (amount !== null && amount !== '' && value >= 0) result[String(categoryId)] = value;
          return result;
        }, {});
        if (Object.keys(clean).length) all[month] = clean;
        return all;
      }, {});
    return {
      ...base,
      ...source,
      initialized: Boolean(source.initialized),
      openingBalance,
      openingBalanceDate,
      transactions: transactions.filter(item => item && typeof item === 'object').map(item => {
        const candidateId = String(item.id || uid('tx'));
        const transactionId = usedTransactionIds.has(candidateId) ? uid('tx') : candidateId;
        usedTransactionIds.add(transactionId);
        return ({
        id: transactionId,
        type: item.type === 'income' ? 'income' : 'expense',
        amount: Math.max(0, numberValue(item.amount)),
        name: String(item.name || ''),
        categoryId: String(item.categoryId || 'autre'),
        date: /^\d{4}-\d{2}-\d{2}$/.test(item.date || '') ? item.date : today(),
        time: /^\d{2}:\d{2}$/.test(item.time || '') ? item.time : '12:00',
        note: String(item.note || ''),
        fixedExpenseId: item.fixedExpenseId || null,
        fixedMonth: /^\d{4}-\d{2}$/.test(item.fixedMonth || '') ? item.fixedMonth : null
      });
      }),
      customCategories: customCategories.filter(item => item && item.id && item.label).map(item => ({ id: String(item.id), label: String(item.label), icon: String(item.icon || '✦') })),
      budgets: source.budgets && typeof source.budgets === 'object' ? source.budgets : {},
      budgetOverrides: normalizedOverrides,
      fixedExpenses: fixedExpenses.map(item => ({
        id: item.id || uid('fixed'),
        name: String(item.name || ''),
        amount: Math.max(0, numberValue(item.amount)),
        categoryId: String(item.categoryId || 'autre'),
        day: Math.min(31, Math.max(1, Number(item.day) || 1))
      })),
      savingsGoal: Math.max(0, numberValue(source.savingsGoal)),
      quickEntry: {
        lastExpenseCategory: String(source.quickEntry?.lastExpenseCategory || 'alimentation'),
        lastIncomeSource: String(source.quickEntry?.lastIncomeSource || '')
      }
    };
  }

  function load() {
    try { return normalizeData(JSON.parse(localStorage.getItem(STORAGE_KEY))); }
    catch { return emptyData(); }
  }
  let data = load();
  let themePreference = (() => {
    try { const stored = localStorage.getItem(THEME_KEY); return THEMES.includes(stored) ? stored : 'system'; }
    catch { return 'system'; }
  })();
  let activePage = PAGES.includes(sessionStorage.getItem('clair-active-page')) ? sessionStorage.getItem('clair-active-page') : 'accueil';
  let selectedMonth = sessionStorage.getItem('clair-selected-month') || monthKey();
  let modalState = null;
  let confirmCallback = null;
  let lastTouchedId = null;
  let toastAction = null;
  let toastTimer = null;
  let historyQuery = '';
  let historyKind = 'all';
  let historyMonth = 'all';
  let historyCategory = 'all';
  let lastModalTrigger = null;

  function applyTheme() {
    const systemDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches || false;
    const resolved = themePreference === 'system' ? (systemDark ? 'dark' : 'light') : themePreference;
    document.documentElement.dataset.theme = resolved;
    document.documentElement.dataset.themePreference = themePreference;
    const themeColor = $('meta[name="theme-color"]');
    if (themeColor) themeColor.content = resolved === 'dark' ? '#0c1720' : '#e9f1ee';
    const button = $('[data-cycle-theme]');
    if (button) {
      const label = themePreference === 'dark' ? 'Nuit' : themePreference === 'light' ? 'Clair' : 'Automatique';
      button.textContent = themePreference === 'dark' ? '☾' : themePreference === 'light' ? '☀' : '◐';
      button.title = `Thème : ${label}. Cliquer pour changer.`;
      button.setAttribute('aria-label', button.title);
    }
    $$('[data-theme-choice]').forEach(choice => {
      choice.setAttribute('aria-pressed', String(choice.dataset.themeChoice === themePreference));
    });
  }
  function setTheme(theme) {
    if (!THEMES.includes(theme)) return;
    themePreference = theme;
    try { localStorage.setItem(THEME_KEY, theme); }
    catch { showToast('Le thème ne pourra pas être mémorisé dans ce navigateur.', 'negative'); }
    applyTheme();
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); return true; }
    catch { showToast('Impossible de sauvegarder ici. Vérifiez l’espace disponible du navigateur.', 'negative'); return false; }
  }
  function allCategories() { return [...CATEGORIES, ...data.customCategories]; }
  function category(id) { return allCategories().find(item => item.id === id) || CATEGORIES[CATEGORIES.length - 1]; }
  function categoryOptions(selected, includeCustom = true) {
    const standard = allCategories().map(item => `<option value="${escapeHtml(item.id)}" ${item.id === selected ? 'selected' : ''}>${escapeHtml(item.icon)} ${escapeHtml(item.label)}</option>`).join('');
    return `${standard}${includeCustom ? `<option value="__new__" ${selected === '__new__' ? 'selected' : ''}>✦ Créer une catégorie…</option>` : ''}`;
  }
  function sortedTransactions(items = data.transactions) {
    return [...items].sort((a, b) => `${b.date} ${b.time}`.localeCompare(`${a.date} ${a.time}`));
  }
  function transactionMonth(transaction) { return transaction.fixedMonth || transaction.date.slice(0, 7); }
  function sameMonth(transaction, month = selectedMonth) { return transactionMonth(transaction) === month; }
  function isActual(transaction) { return transaction.date <= today(); }
  function sum(items) { return items.reduce((total, item) => total + Number(item.amount || 0), 0); }
  function totals(items) {
    return { income: sum(items.filter(item => item.type === 'income')), expenses: sum(items.filter(item => item.type === 'expense')) };
  }
  function financialTotals(items) {
    const income = sum(items.filter(item => item.type === 'income'));
    const savings = sum(items.filter(item => item.type === 'expense' && item.categoryId === 'epargne'));
    const spending = sum(items.filter(item => item.type === 'expense' && item.categoryId !== 'epargne'));
    return { income, spending, savings, outflow: spending + savings };
  }
  function availableBalance() {
    const actual = financialTotals(data.transactions.filter(isActual));
    return data.openingBalance + actual.income - actual.outflow;
  }
  function spendingByCategory(items) {
    const result = new Map();
    items.filter(item => item.type === 'expense').forEach(item => result.set(item.categoryId, (result.get(item.categoryId) || 0) + item.amount));
    return [...result.entries()].map(([id, amount]) => ({ category: category(id), amount })).sort((a, b) => b.amount - a.amount);
  }
  function getSavings(items = data.transactions) { return sum(items.filter(item => item.type === 'expense' && item.categoryId === 'epargne')); }
  function budgetAmount(categoryId, month = selectedMonth) {
    const overrides = data.budgetOverrides?.[month] || {};
    return Object.prototype.hasOwnProperty.call(overrides, categoryId) ? numberValue(overrides[categoryId]) : numberValue(data.budgets?.[categoryId]);
  }
  function hasBudgetOverride(categoryId, month = selectedMonth) { return Object.prototype.hasOwnProperty.call(data.budgetOverrides?.[month] || {}, categoryId); }
  function budgetPlan(month = selectedMonth) {
    const ids = new Set([...Object.keys(data.budgets || {}), ...Object.keys(data.budgetOverrides?.[month] || {})]);
    return [...ids].reduce((total, categoryId) => total + budgetAmount(categoryId, month), 0);
  }
  function monthlyBudgetSummary(items = data.transactions.filter(item => sameMonth(item))) {
    const planned = budgetPlan(selectedMonth);
    const totalSpent = sum(items.filter(item => item.type === 'expense' && item.categoryId !== 'epargne'));
    const plannedCategories = new Set([...Object.keys(data.budgets || {}), ...Object.keys(data.budgetOverrides?.[selectedMonth] || {})].filter(id => budgetAmount(id, selectedMonth) > 0));
    const budgetedSpent = sum(items.filter(item => item.type === 'expense' && plannedCategories.has(item.categoryId)));
    const consumptionBudgeted = sum(items.filter(item => item.type === 'expense' && item.categoryId !== 'epargne' && plannedCategories.has(item.categoryId)));
    return {
      planned,
      totalSpent,
      budgetedSpent,
      remaining: planned - budgetedSpent,
      unplannedSpent: totalSpent - consumptionBudgeted,
      percent: planned ? Math.round((budgetedSpent / planned) * 100) : 0
    };
  }
  function currentMonthForecast(items) {
    if (selectedMonth !== monthKey()) return null;
    const now = new Date();
    const elapsed = Math.max(1, now.getDate());
    const days = maxDays(now.getFullYear(), now.getMonth() + 1);
    return Math.round((sum(items.filter(item => item.date <= today() && item.type === 'expense' && item.categoryId !== 'epargne')) / elapsed) * days * 100) / 100;
  }
  function previousMonthKey(month = selectedMonth) { return monthForOffset(month, -1); }
  function donutGradient(entries) {
    if (!entries.length) return '#edf0ea';
    const total = entries.reduce((sum, item) => sum + item.amount, 0) || 1;
    let at = 0;
    return `conic-gradient(${entries.slice(0, 5).map((item, index) => {
      const start = at;
      at += (item.amount / total) * 100;
      return `${CHART_COLORS[index]} ${start}% ${at}%`;
    }).join(', ')})`;
  }
  function maxDays(year, month) { return new Date(year, month, 0).getDate(); }
  function monthForOffset(baseMonth, offset) {
    const [year, month] = baseMonth.split('-').map(Number);
    const date = new Date(year, month - 1 + offset, 1);
    return monthKey(date);
  }
  function changeMonth(offset) {
    selectedMonth = monthForOffset(selectedMonth, offset);
    sessionStorage.setItem('clair-selected-month', selectedMonth);
    render();
  }
  function recentExpenseCategories() {
    const used = sortedTransactions(data.transactions.filter(item => item.type === 'expense'));
    return [...new Set(used.map(item => item.categoryId))].filter(id => id !== 'epargne').slice(0, 3).map(category);
  }

  function transactionRow(item, { actions = true, showDate = false } = {}) {
    const cat = category(item.categoryId);
    const isIncome = item.type === 'income';
    const name = item.name || (isIncome ? 'Argent reçu' : cat.label);
    const fixedContext = item.fixedMonth ? ` · Pour ${formatMonth(item.fixedMonth)}` : '';
    const details = isIncome ? (item.note || 'Reçu') : `${cat.label}${item.note ? ` · ${item.note}` : ''}${fixedContext}`;
    return `<article class="transaction-row ${lastTouchedId === item.id ? 'just-added' : ''}" data-transaction-row="${item.id}">
      <div class="transaction-icon ${isIncome ? 'income' : ''}">${isIncome ? '↗' : escapeHtml(cat.icon)}</div>
      <div class="transaction-info">
        <div class="transaction-name">${escapeHtml(name)}</div>
        <div class="transaction-meta">${showDate ? `${escapeHtml(formatDate(item.date))} · ` : ''}${escapeHtml(details)} · ${escapeHtml(item.time)}</div>
      </div>

      ${actions ? `<div class="row-actions"><button class="mini-icon" data-edit-transaction="${item.id}" title="Modifier" aria-label="Modifier ${escapeHtml(name)}">✎</button><button class="mini-icon delete" data-delete-transaction="${item.id}" title="Supprimer" aria-label="Supprimer ${escapeHtml(name)}">×</button></div>` : ''}
    </article>`;
  }
  function emptyState(icon, copy) { return `<div class="empty-state"><div><div class="empty-icon">${icon}</div>${copy}</div></div>`; }
  function monthSwitcher() { return `<div class="month-switcher"><button data-month-prev aria-label="Mois précédent">‹</button><span>${escapeHtml(formatMonth(selectedMonth))}</span><button data-month-next aria-label="Mois suivant">›</button></div>`; }

          <section class="budget-glance ${budget.planned ? '' : 'is-empty'}"><div><span>Budget du mois</span><b>${budget.planned ? budgetCopy : 'Votre prochain repère'}</b></div><button class="subtle-link" data-page="budget">${budget.planned ? 'Voir le budget' : 'Configurer'}</button>${budget.planned ? `<div class="progress-track"><div class="progress-fill ${budget.percent > 100 ? 'over' : budget.percent >= 80 ? 'close' : ''}" style="width:${Math.min(100, budget.percent)}%"></div></div>` : ''}</section>
          <div class="small-stat-grid"><div class="small-stat"><span>Dépensé aujourd’hui</span><b>${money(spendingToday)}</b></div><div class="small-stat"><span>Dépensé ce mois</span><b>${money(monthlyExpense)}</b></div><div class="small-stat"><span>Épargne</span><b>${money(getSavings())}</b></div></div>
        </div></div>`;

  }

  function fixedPayment(fixedExpense, month = selectedMonth) {
    return data.transactions.find(item => item.type === 'expense' && item.fixedExpenseId === fixedExpense.id && sameMonth(item, month));
  }
  function isFixedPaid(fixedExpense, month) { return Boolean(fixedPayment(fixedExpense, month)); }
  function fixedSummary(month = selectedMonth) {
    const total = sum(data.fixedExpenses);
    const paid = sum(data.fixedExpenses.map(item => fixedPayment(item, month)).filter(Boolean));
    return { total, paid, remaining: Math.max(0, total - paid) };
  }
  function fixedDueCopy(fixedExpense, month = selectedMonth) {
    const payment = fixedPayment(fixedExpense, month);
    if (payment) return `Payée le ${formatDate(payment.date)}`;
    const [year, monthNumber] = month.split('-').map(Number);
    const dueDate = `${month}-${pad(Math.min(fixedExpense.day, maxDays(year, monthNumber)))}`;
    if (month > monthKey()) return `Prévue le ${formatDate(dueDate)}`;
    if (month === monthKey() && dueDate === today()) return 'À prévoir aujourd’hui';
    if (month === monthKey() && dueDate < today()) return `À prévoir depuis le ${formatDate(dueDate)}`;
    return `Prévue le ${formatDate(dueDate)}`;
  }
  function renderBudget() {
    const items = data.transactions.filter(item => sameMonth(item));

    const budgetEntries = [...identifiers].map(id => ({
      category: category(id),
      spent: spent.find(item => item.category.id === id)?.amount || 0,
      budget: budgetAmount(id),
      override: hasBudgetOverride(id)
    })).sort((a, b) => {
      const attention = entry => entry.budget ? entry.spent / entry.budget : 0;
      return attention(b) - attention(a) || b.spent - a.spent || a.category.label.localeCompare(b.category.label, 'fr');

    const forecast = currentMonthForecast(items);

    const previousPlan = budgetPlan(previousMonthKey());
    const savings = getSavings();
    const savingsPercent = data.savingsGoal ? Math.min(100, Math.round((savings / data.savingsGoal) * 100)) : 0;
