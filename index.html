      <div class="budget-layout"><div><div class="section-heading"><h2>Budgets de ${escapeHtml(formatMonth(selectedMonth))}</h2><div class="section-actions">${previousPlan ? `<button class="subtle-link" data-copy-previous-budgets>Reprendre le mois précédent</button>` : ''}<button class="subtle-link" data-open-budget>Ajouter</button></div></div><div class="budget-list">${budgetEntries.length ? budgetEntries.map(entry => budgetRow(entry)).join('') : emptyState('◒', 'Ajoutez un budget pour une catégorie qui compte pour vous.')}</div></div>
      <aside class="budget-side"><section class="savings-card"><div class="section-heading"><h2>Épargne</h2><button class="subtle-link" data-add-savings>Ajouter</button></div><p class="savings-number">${money(savings)} <span class="helper">/ ${data.savingsGoal ? money(data.savingsGoal) : 'objectif à définir'}</span></p><div class="progress-track"><div class="progress-fill" style="width:${savingsPercent}%"></div></div><p class="helper" style="margin:11px 0 0">${savingsThisMonth ? `${money(savingsThisMonth)} mis de côté ce mois-ci` : savingsLeft ? `${money(savingsLeft)} pour atteindre votre objectif` : 'Objectif atteint — continuez à votre rythme.'}</p><form class="settings-form" data-savings-goal><label class="field"><span>Votre objectif</span><input inputmode="decimal" name="goal" value="${data.savingsGoal || ''}" placeholder="Ex. 300" /></label><button class="secondary-button" type="submit" style="margin-top:10px">Enregistrer l’objectif</button></form></section>
      <section class="savings-card"><div class="section-heading"><h2>Charges fixes</h2><button class="subtle-link" data-open-fixed>Ajouter</button></div>${data.fixedExpenses.length ? `<div class="fixed-summary"><span>${money(fixed.paid)} payées</span><b>${money(fixed.remaining)} à prévoir</b></div><div class="fixed-list">${data.fixedExpenses.map(item => fixedRow(item)).join('')}</div><p class="helper" style="margin:13px 0 0">Total prévu ce mois : <b>${money(fixed.total)}</b></p>` : `<p class="helper">Vos charges prévues apparaîtront ici. Elles ne deviennent une dépense que lorsque vous les marquez comme payées.</p>`}</section></aside></div>`;
  }
  function budgetRow(entry) {
    const percent = entry.budget ? Math.round((entry.spent / entry.budget) * 100) : 0;
    const status = percent > 100 ? 'over' : percent >= 80 ? 'close' : '';
    const left = entry.budget - entry.spent;
    const scope = entry.override ? `Ajusté pour ${formatMonth(selectedMonth)}` : 'Chaque mois';
    const resetControl = entry.override
      ? `<button class="reset-budget" data-reset-budget="${escapeHtml(entry.category.id)}">Revenir au budget récurrent</button>`
      : `<button class="reset-budget" data-remove-budget="${escapeHtml(entry.category.id)}">Supprimer ce budget</button>`;
    const details = entry.budget
      ? `<div class="budget-row-bottom"><span>Dépensé : ${money(entry.spent)}</span><span class="${left < 0 ? 'over' : ''}">${left >= 0 ? `Reste : ${money(left)}` : `Dépassement : ${money(Math.abs(left))}`}</span></div><div class="progress-track"><div class="progress-fill ${status}" style="width:${Math.min(100, percent)}%"></div></div>${resetControl}`
      : `<div class="budget-row-bottom"><span>Dépensé ce mois : ${money(entry.spent)}</span><span>${entry.override ? 'Sans budget ce mois' : 'Ajoutez un budget'}</span></div>${entry.override ? resetControl : ''}`;
    return `<div class="budget-row"><div class="budget-row-top"><span class="transaction-icon" style="width:31px;height:31px;border-radius:9px;font-size:15px">${escapeHtml(entry.category.icon)}</span><span class="category-name">${escapeHtml(entry.category.label)}<small>${escapeHtml(scope)}</small></span><input class="budget-amount" data-budget-input="${escapeHtml(entry.category.id)}" inputmode="decimal" value="${entry.budget || ''}" placeholder="Budget €" aria-label="Budget ${escapeHtml(entry.category.label)} pour ${escapeHtml(formatMonth(selectedMonth))}" /></div>${details}</div>`;
  }
  function fixedRow(item) {
    const payment = fixedPayment(item, selectedMonth);
    const paid = Boolean(payment);
    const cat = category(item.categoryId);
    return `<div class="fixed-row ${paid ? 'is-paid' : ''}"><span class="transaction-icon" style="width:30px;height:30px;border-radius:9px;font-size:15px">${escapeHtml(cat.icon)}</span><div class="fixed-main"><b>${escapeHtml(item.name)}</b><span>${escapeHtml(cat.label)} · ${escapeHtml(fixedDueCopy(item))}</span></div><span class="fixed-amount">${money(item.amount)}</span><div class="fixed-actions">${paid ? `<button class="pay-button paid" data-unpay-fixed="${item.id}" title="Marquer non payée">Payée</button>` : `<button class="pay-button" data-pay-fixed="${item.id}">Marquer payée</button>`}<button class="mini-icon" data-edit-fixed="${item.id}" aria-label="Modifier">✎</button><button class="mini-icon delete" data-delete-fixed="${item.id}" aria-label="Supprimer">×</button></div></div>`;
  }

  function historyItems() {
    return sortedTransactions(data.transactions.filter(item => {
      const cat = category(item.categoryId);
      const searchText = `${item.name} ${item.note} ${cat.label}`.toLowerCase();
      return (!historyQuery || searchText.includes(historyQuery))
        && (historyKind === 'all' || item.type === historyKind)
        && (historyMonth === 'all' || transactionMonth(item) === historyMonth)
        && (historyCategory === 'all' || item.categoryId === historyCategory);
    }));
  }
  function historyResultsMarkup() {
    const items = historyItems();
    const group = items.reduce((map, item) => {
      (map[item.date] ||= []).push(item);
      return map;
    }, {});
    const hasFilter = historyQuery || historyKind !== 'all' || historyMonth !== 'all' || historyCategory !== 'all';
    return items.length ? Object.entries(group).map(([date, transactions]) => `<div class="history-date" style="padding:0 16px">${escapeHtml(formatFullDate(date))}</div>${transactions.map(item => transactionRow(item)).join('')}`).join('') : emptyState('⌕', hasFilter ? 'Aucune opération ne correspond à ces filtres.' : 'Vos opérations apparaîtront ici.');
  }
  function updateHistoryResults() {
    const results = $('#history-results');
    if (results) results.innerHTML = historyResultsMarkup();
  }
  function renderHistory() {
    const allMonths = [...new Set([selectedMonth, ...data.transactions.map(item => transactionMonth(item))])].sort().reverse();
    const usedCategories = [...new Set(data.transactions.filter(item => item.type === 'expense').map(item => item.categoryId))].map(category);
    const container = $('#page-historique');
    container.innerHTML = `<div class="page-heading"><p class="eyebrow">Historique</p><h1>Toutes vos<br /><em>opérations.</em></h1></div><div class="history-tools"><input id="history-search" class="search-input" value="${escapeHtml(historyQuery)}" placeholder="Rechercher CROUS, transport, poulet…" autocomplete="off" /><select id="history-filter" class="select-input" aria-label="Type d’opération"><option value="all">Tout afficher</option><option value="expense">Dépenses</option><option value="income">Argent reçu</option></select><select id="history-month" class="select-input" aria-label="Mois"><option value="all">Tous les mois</option>${allMonths.map(month => `<option value="${month}">${escapeHtml(formatMonth(month))}</option>`).join('')}</select><select id="history-category" class="select-input" aria-label="Catégorie"><option value="all">Toutes catégories</option>${usedCategories.map(item => `<option value="${escapeHtml(item.id)}">${escapeHtml(item.icon)} ${escapeHtml(item.label)}</option>`).join('')}</select></div><div id="history-results" class="transaction-list">${historyResultsMarkup()}</div>`;
    $('#history-filter').value = historyKind;
    $('#history-month').value = historyMonth;
    $('#history-category').value = historyCategory;
  }

  function render() {
    const renderers = {
      accueil: renderHome,
      journal: renderJournal,
      resume: renderResume,
      budget: renderBudget,
      historique: renderHistory
    };
    (renderers[activePage] || renderHome)();
    const monthControl = $('[data-month-control]');
    monthControl.textContent = formatMonth(selectedMonth);
    monthControl.hidden = !['resume', 'budget'].includes(activePage);
    $$('.page').forEach(page => page.classList.toggle('active-page', page.dataset.pagePanel === activePage));
    $$('[data-page]').forEach(button => {
      const isActive = button.dataset.page === activePage;
      button.classList.toggle('active', isActive);
      if (isActive) button.setAttribute('aria-current', 'page'); else button.removeAttribute('aria-current');
    });
  }
  function showPage(page) {
    activePage = page;
    sessionStorage.setItem('clair-active-page', activePage);
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderModal(markup, state = {}) {
    if (!modalState) lastModalTrigger = document.activeElement;
    modalState = state;
    $('#modal-root').innerHTML = `<div class="modal-backdrop" data-close-modal><div class="modal ${state.wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${escapeHtml(state.label || 'Fenêtre')}"><div class="modal-handle"></div>${markup}</div></div>`;
    setTimeout(() => $('.modal [name="amount"], .modal [name="name"], .modal select, .modal .close-modal')?.focus(), 50);
  }
  function closeModal() {
    const focusTarget = lastModalTrigger;
    $('#modal-root').innerHTML = '';
    modalState = null;
    confirmCallback = null;
    lastModalTrigger = null;
    if (focusTarget instanceof HTMLElement) setTimeout(() => focusTarget.focus({ preventScroll: true }), 0);
  }

  function openTransaction({ type = 'expense', transaction = null, presetCategory = null } = {}) {
    const editing = Boolean(transaction);
    const original = transaction || {
      type,
      amount: '',
      name: type === 'income' ? data.quickEntry.lastIncomeSource : '',
      categoryId: presetCategory || data.quickEntry.lastExpenseCategory || 'alimentation',
      date: today(),
      time: nowTime(),
      note: ''
    };
    const form = transactionForm(original, editing);
    renderModal(`<div class="modal-heading"><div><h2>${editing ? 'Modifier l’opération' : 'Nouvelle opération'}</h2><p>${editing ? 'Vos totaux seront recalculés automatiquement.' : 'Ajoutez-la en quelques secondes.'}</p></div><button class="close-modal" data-close-modal aria-label="Fermer">×</button></div>${form}`, { label: editing ? 'Modifier une opération' : 'Ajouter une opération', transactionId: transaction?.id || null });
  }
  function switchTransactionMode(type) {
    const form = $('.modal [data-transaction-form]');
    if (!form) return;
    const fields = new FormData(form);
    const transactionId = modalState?.transactionId || null;
    const previous = transactionId ? data.transactions.find(item => item.id === transactionId) : null;
    const draft = {
      ...(previous || {}),
      type,
      amount: fields.get('amount') || '',
      name: fields.get('name') || (type === 'income' ? data.quickEntry.lastIncomeSource : ''),
      categoryId: type === 'income' ? 'income' : (fields.get('categoryId') || data.quickEntry.lastExpenseCategory || 'alimentation'),
      date: fields.get('date') || today(),
      note: fields.get('note') || ''
    };
    renderModal(`<div class="modal-heading"><div><h2>${transactionId ? 'Modifier l’opération' : 'Nouvelle opération'}</h2><p>${transactionId ? 'Vos totaux seront recalculés automatiquement.' : 'Ajoutez-la en quelques secondes.'}</p></div><button class="close-modal" data-close-modal aria-label="Fermer">×</button></div>${transactionForm(draft, Boolean(transactionId))}`, { label: transactionId ? 'Modifier une opération' : 'Ajouter une opération', transactionId });
  }
  function transactionForm(item, editing) {
    const income = item.type === 'income';
    const expenseDescription = item.name || '';
    const recents = recentExpenseCategories();
    return `<div class="mode-toggle"><button type="button" class="${income ? 'active' : ''}" data-transaction-mode="income">+ Argent reçu</button><button type="button" class="${!income ? 'active' : ''}" data-transaction-mode="expense">− Dépense</button></div><form class="transaction-form" data-transaction-form><input type="hidden" name="type" value="${income ? 'income' : 'expense'}" /><div class="amount-input"><span>Montant</span><input name="amount" inputmode="decimal" autocomplete="off" value="${item.amount || ''}" placeholder="0" required /><b>€</b></div><div class="form-grid"><label class="field"><span>${income ? 'Source' : 'Description (facultative)'}</span><input name="name" value="${escapeHtml(expenseDescription)}" autocomplete="off" placeholder="${income ? 'Ex. Salaire' : 'Ex. CROUS'}" /></label>${income ? `<label class="field"><span>Date</span><input name="date" type="date" value="${escapeHtml(item.date)}" required /></label>` : `<label class="field"><span>Catégorie</span><select name="categoryId">${categoryOptions(item.categoryId)}</select></label>`}</div>${income ? `<div class="suggestions"><span class="helper" style="width:100%">Sources fréquentes</span>${INCOME_SOURCES.map(source => `<button type="button" class="suggestion" data-fill-name="${escapeHtml(source)}">${escapeHtml(source)}</button>`).join('')}</div>` : `<div class="custom-category-wrap ${item.categoryId === '__new__' ? 'visible' : ''}"><label class="field"><span>Nom de la catégorie</span><input name="customCategory" value="" placeholder="Ex. Animaux" /></label></div>${recents.length ? `<div class="suggestions recent-suggestions"><span class="helper" style="width:100%">Récemment utilisées</span>${recents.map(cat => `<button type="button" class="suggestion" data-set-category="${cat.id}">${escapeHtml(cat.icon)} ${escapeHtml(cat.label)}</button>`).join('')}</div>` : ''}<div class="suggestions" id="smart-suggestion"></div>`}<div class="form-grid">${income ? `<label class="field"><span>Note (facultative)</span><input name="note" value="${escapeHtml(item.note)}" placeholder="Ex. Septembre" /></label>` : `<label class="field"><span>Date</span><input name="date" type="date" value="${escapeHtml(item.date)}" required /></label><label class="field"><span>Note (facultative)</span><input name="note" value="${escapeHtml(item.note)}" placeholder="Une précision" /></label>`}</div><div class="form-actions"><button type="button" class="secondary-button" data-close-modal>Annuler</button><button class="primary-button" type="submit">${editing ? 'Enregistrer' : 'Ajouter'} <span>→</span></button></div></form>`;
  }

  function openBudget() {
    renderModal(`<div class="modal-heading"><div><h2>Ajouter un budget</h2><p>Un repère simple, sans pression.</p></div><button class="close-modal" data-close-modal>×</button></div><form class="transaction-form" data-budget-form><label class="field"><span>Catégorie</span><select name="categoryId">${categoryOptions('alimentation', false)}</select></label><label class="field"><span>Budget mensuel</span><input name="amount" inputmode="decimal" placeholder="Ex. 150" required /></label><label class="field"><span>Ce budget s’applique</span><select name="scope"><option value="recurring">Chaque mois</option><option value="month">Seulement ${escapeHtml(formatMonth(selectedMonth))}</option></select></label><p class="helper">Vous pourrez ajuster un mois sans changer votre budget habituel.</p><div class="form-actions"><button type="button" class="secondary-button" data-close-modal>Annuler</button><button class="primary-button">Ajouter</button></div></form>`, { label: 'Ajouter un budget' });
  }

  function openFixedExpense(existing = null) {
    const fixed = existing || { name: '', amount: '', categoryId: 'logement', day: 1 };
    renderModal(`<div class="modal-heading"><div><h2>${existing ? 'Modifier la charge fixe' : 'Nouvelle charge fixe'}</h2><p>Elle reste prévue jusqu’à ce que vous la marquiez comme payée.</p></div><button class="close-modal" data-close-modal>×</button></div><form class="transaction-form" data-fixed-form><div class="form-grid"><label class="field"><span>Nom</span><input name="name" value="${escapeHtml(fixed.name)}" placeholder="Ex. Loyer" required /></label><label class="field"><span>Montant</span><input name="amount" value="${fixed.amount || ''}" inputmode="decimal" placeholder="0" required /></label></div><div class="form-grid"><label class="field"><span>Catégorie</span><select name="categoryId">${categoryOptions(fixed.categoryId, false)}</select></label><label class="field"><span>Jour du mois</span><input name="day" value="${fixed.day}" type="number" min="1" max="31" required /></label></div><div class="form-actions"><button type="button" class="secondary-button" data-close-modal>Annuler</button><button class="primary-button">${existing ? 'Enregistrer' : 'Ajouter'}</button></div></form>`, { label: 'Charge fixe', fixedId: existing?.id || null });
  }

  function openSettings() {
    renderModal(`<div class="modal-heading"><div><h2>Paramètres</h2><p>Vos informations vous appartiennent.</p></div><button class="close-modal" data-close-modal aria-label="Fermer">×</button></div><div class="settings-list"><section class="settings-group"><h3>Apparence</h3><p>Choisissez l’ambiance qui vous plaît. Le choix reste enregistré sur cet appareil.</p><div class="theme-choices" role="group" aria-label="Choisir un thème"><button type="button" class="theme-choice" data-theme-choice="light" aria-pressed="false"><span class="theme-swatch light" aria-hidden="true"></span>Clair<small>Lumineux</small></button><button type="button" class="theme-choice" data-theme-choice="dark" aria-pressed="false"><span class="theme-swatch dark" aria-hidden="true"></span>Nuit<small>Élégant</small></button><button type="button" class="theme-choice" data-theme-choice="system" aria-pressed="false"><span class="theme-swatch system" aria-hidden="true"></span>Auto<small>Suit l’appareil</small></button></div></section><section class="settings-group"><h3>Sauvegarder vos données</h3><p>Exportez un fichier JSON à garder en lieu sûr ou à importer sur un autre appareil.</p><div class="settings-actions"><button class="secondary-button" data-export>Exporter mes données</button><label class="secondary-button" style="display:inline-flex;align-items:center;cursor:pointer">Importer mes données<input id="import-file" type="file" accept="application/json,.json" hidden /></label></div></section><section class="settings-group"><h3>Supprimer toutes les données</h3><p>Cette action efface vos opérations, budgets, charges fixes et objectif de ce navigateur.</p><button class="danger-button" data-clear-data>Supprimer mes données</button></section></div>`, { label: 'Paramètres' });
    applyTheme();
  }

  function openMonthPicker() {
    renderModal(`<div class="modal-heading"><div><h2>Changer de mois</h2><p>Consultez vos totaux à votre rythme.</p></div><button class="close-modal" data-close-modal>×</button></div><div style="display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0 7px"><button class="secondary-button" data-month-prev>← Précédent</button><b style="text-transform:capitalize">${escapeHtml(formatMonth(selectedMonth))}</b><button class="secondary-button" data-month-next>Suivant →</button></div>`, { label: 'Changer de mois' });
  }

  function openConfirm({ title, copy, danger = false, strong = false, callback }) {
    confirmCallback = callback;
    renderModal(`<div class="confirmation"><div class="warning-mark">${danger ? '!' : '?'}</div><h2>${escapeHtml(title)}</h2><p>${escapeHtml(copy)}</p>${strong ? `<label class="field" style="text-align:left"><span>Écrivez SUPPRIMER pour confirmer</span><input id="strong-confirmation" autocomplete="off" /></label>` : ''}<div class="form-actions"><button class="secondary-button" data-close-modal>Annuler</button><button class="${danger ? 'danger-button' : 'primary-button'}" data-confirm-action ${strong ? 'disabled' : ''}>${danger ? 'Supprimer' : 'Confirmer'}</button></div></div>`, { label: title });
  }

  function showToast(text, kind = 'positive', action = null) {
    clearTimeout(toastTimer);
    toastAction = action;
    $('#toast-root').innerHTML = `<div class="toast ${kind === 'negative' ? 'negative' : ''}">${kind === 'negative' ? '!' : '✓'} <span>${escapeHtml(text)}</span>${action ? `<button data-toast-undo>${escapeHtml(action.label || 'Annuler')}</button>` : ''}</div>`;
    toastTimer = setTimeout(() => { $('#toast-root').innerHTML = ''; toastAction = null; }, action ? 5000 : 3000);
  }
  function rerenderAfterChange({ toast, balance, touchedId = null, toastUndo = null } = {}) {
    lastTouchedId = touchedId;
    const persisted = save();
    render();
    if (balance) setTimeout(() => $('#balance-amount')?.classList.add('bump'), 20);
    if (toast && persisted) showToast(toast, 'positive', toastUndo);
    if (touchedId) setTimeout(() => { lastTouchedId = null; }, 650);
    return persisted;
  }

  function updateSmartSuggestion(input) {
    const root = $('#smart-suggestion');
    if (!root) return;
    const value = input.value.trim().toLowerCase();
    if (value.length < 2) { root.innerHTML = ''; return; }
    const found = CATEGORIES.find(item => item.keywords.some(keyword => value.includes(keyword)) && item.id !== 'autre');
    root.innerHTML = found ? `<span class="helper">Suggestion</span><button type="button" class="suggestion" data-set-category="${found.id}">${escapeHtml(found.icon)} Classer dans ${escapeHtml(found.label)}</button>` : '';
  }

  function submitTransaction(form) {
    const formData = new FormData(form);
    const type = formData.get('type');
    const amount = numberValue(formData.get('amount'));
    let categoryId = type === 'income' ? 'income' : formData.get('categoryId');
    if (categoryId === '__new__') {
      const label = String(formData.get('customCategory') || '').trim();
      if (!label) { showToast('Donnez un nom à cette catégorie.', 'negative'); return; }
      const existing = allCategories().find(item => item.label.toLowerCase() === label.toLowerCase());
      categoryId = existing?.id || uid('category');
      if (!existing) data.customCategories.push({ id: categoryId, label, icon: '✦' });
    }
    if (amount <= 0) { showToast('Indiquez un montant supérieur à 0 €.', 'negative'); return; }
    const item = {
      id: modalState?.transactionId || uid('tx'),
      type,
      amount,
      name: String(formData.get('name') || '').trim() || (type === 'income' ? 'Argent reçu' : category(categoryId).label),
      categoryId,
      date: formData.get('date') || today(),
      time: modalState?.transactionId ? data.transactions.find(tx => tx.id === modalState.transactionId)?.time || nowTime() : nowTime(),
      note: String(formData.get('note') || '').trim(),
      fixedExpenseId: modalState?.transactionId ? data.transactions.find(tx => tx.id === modalState.transactionId)?.fixedExpenseId || null : null,
      fixedMonth: modalState?.transactionId ? data.transactions.find(tx => tx.id === modalState.transactionId)?.fixedMonth || null : null
    };
    const index = data.transactions.findIndex(tx => tx.id === item.id);
    const isEditing = index >= 0;
    if (isEditing) data.transactions[index] = item; else data.transactions.push(item);
    if (type === 'income') data.quickEntry.lastIncomeSource = item.name;
    else data.quickEntry.lastExpenseCategory = categoryId;
    closeModal();
    rerenderAfterChange({ toast: isEditing ? 'Opération modifiée.' : type === 'income' ? `${money(amount)} reçu.` : `${money(amount)} ajouté à vos dépenses.`, balance: true, touchedId: item.id });
  }

  function payFixedExpense(id) {
    const fixed = data.fixedExpenses.find(item => item.id === id);
    if (!fixed || isFixedPaid(fixed, selectedMonth)) return;
    data.transactions.push({ id: uid('tx'), type: 'expense', amount: fixed.amount, name: fixed.name, categoryId: fixed.categoryId, date: today(), time: nowTime(), note: `Charge fixe · ${formatMonth(selectedMonth)}`, fixedExpenseId: fixed.id, fixedMonth: selectedMonth });
    rerenderAfterChange({ toast: `${fixed.name} est marquée comme payée.`, balance: true, touchedId: data.transactions.at(-1).id });
  }

  function deleteTransactionWithUndo(transaction, { removedMessage = 'Opération supprimée.', restoredMessage = 'Opération restaurée.' } = {}) {
    const originalIndex = data.transactions.findIndex(item => item.id === transaction.id);
    const row = document.querySelector(`[data-transaction-row="${transaction.id}"]`);
    row?.classList.add('removing');
    setTimeout(() => {
      data.transactions = data.transactions.filter(item => item.id !== transaction.id);
      rerenderAfterChange({
        toast: removedMessage,
        balance: true,
        toastUndo: {
          label: 'Annuler',
          callback: () => {
            if (!data.transactions.some(item => item.id === transaction.id)) {
              data.transactions.splice(Math.max(0, originalIndex), 0, transaction);
              rerenderAfterChange({ toast: restoredMessage, balance: true, touchedId: transaction.id });
            }
          }
        }
      });
    }, row ? 160 : 0);
  }

  function unpayFixedExpense(id) {
    const fixed = data.fixedExpenses.find(item => item.id === id);
    const payment = fixed && fixedPayment(fixed, selectedMonth);
    if (!payment) return;
    deleteTransactionWithUndo(payment, { removedMessage: `${fixed.name} est à nouveau à prévoir.`, restoredMessage: `${fixed.name} est de nouveau marquée comme payée.` });
  }

  function exportData() {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `clair-sauvegarde-${today()}.json`;
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 500);
    showToast('Vos données ont été exportées.');
  }
  function importData(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = event => {
      try {
        const parsed = JSON.parse(event.target.result);
        if (!parsed || !Array.isArray(parsed.transactions)) throw new Error('format');
        const imported = normalizeData({ ...parsed, initialized: true });
        openConfirm({
          title: 'Remplacer vos données ?',
          copy: `${imported.transactions.length} opération${imported.transactions.length > 1 ? 's' : ''} ${imported.transactions.length > 1 ? 'seront' : 'sera'} importée${imported.transactions.length > 1 ? 's' : ''}. Vos données actuelles seront remplacées.`,
          danger: true,
          callback: () => {
            data = imported;
            rerenderAfterChange({ toast: 'Vos données ont été importées.' });
          }
        });
      } catch { showToast('Ce fichier ne semble pas être une sauvegarde Clair valide.', 'negative'); }
    };
    reader.readAsText(file);
  }

  document.addEventListener('click', event => {
    const target = event.target.closest('button, [data-page], [data-close-modal], [data-open-transaction], [data-open-budget], [data-open-fixed], [data-add-savings], [data-edit-transaction], [data-delete-transaction], [data-pay-fixed], [data-unpay-fixed], [data-edit-fixed], [data-delete-fixed], [data-reset-budget], [data-remove-budget], [data-copy-previous-budgets], [data-open-category-history], [data-month-control], [data-month-prev], [data-month-next], [data-export], [data-clear-data], [data-confirm-action], [data-fill-name], [data-set-category], [data-transaction-mode], [data-toast-undo]');
    if (!target) return;
    if (target.hasAttribute('data-close-modal') && (target === event.target || target.classList.contains('close-modal') || target.closest('.close-modal'))) { closeModal(); return; }
    if (target.dataset.themeChoice) { setTheme(target.dataset.themeChoice); return; }
    if (target.hasAttribute('data-cycle-theme')) { setTheme(THEMES[(THEMES.indexOf(themePreference) + 1) % THEMES.length]); return; }
    if (target.dataset.page) { showPage(target.dataset.page); return; }
    if (target.dataset.openCategoryHistory) {
      historyKind = 'expense';
      historyMonth = selectedMonth;
      historyCategory = target.dataset.openCategoryHistory;
      showPage('historique');
      return;
    }
    if (target.hasAttribute('data-month-control')) { openMonthPicker(); return; }
    if (target.hasAttribute('data-month-prev')) { changeMonth(-1); if (modalState?.label === 'Changer de mois') openMonthPicker(); return; }
    if (target.hasAttribute('data-month-next')) { changeMonth(1); if (modalState?.label === 'Changer de mois') openMonthPicker(); return; }
    if (target.dataset.openTransaction !== undefined) { openTransaction({ type: target.dataset.openTransaction || 'expense' }); return; }
    if (target.dataset.transactionMode) { switchTransactionMode(target.dataset.transactionMode); return; }
    if (target.hasAttribute('data-open-budget')) { openBudget(); return; }
    if (target.hasAttribute('data-open-fixed')) { openFixedExpense(); return; }
    if (target.hasAttribute('data-add-savings')) { openTransaction({ type: 'expense', presetCategory: 'epargne' }); return; }
    if (target.dataset.editTransaction) { const transaction = data.transactions.find(item => item.id === target.dataset.editTransaction); if (transaction) openTransaction({ transaction }); return; }
    if (target.dataset.deleteTransaction) { const transaction = data.transactions.find(item => item.id === target.dataset.deleteTransaction); if (!transaction) return; openConfirm({ title: 'Supprimer cette opération ?', copy: 'Elle sera retirée de vos totaux.', danger: true, callback: () => deleteTransactionWithUndo(transaction) }); return; }
    if (target.dataset.payFixed) { payFixedExpense(target.dataset.payFixed); return; }
    if (target.dataset.unpayFixed) { unpayFixedExpense(target.dataset.unpayFixed); return; }
    if (target.dataset.editFixed) { const fixed = data.fixedExpenses.find(item => item.id === target.dataset.editFixed); if (fixed) openFixedExpense(fixed); return; }
    if (target.dataset.deleteFixed) { const fixed = data.fixedExpenses.find(item => item.id === target.dataset.deleteFixed); if (!fixed) return; openConfirm({ title: 'Supprimer cette charge fixe ?', copy: 'Les dépenses déjà marquées comme payées resteront dans votre historique.', danger: true, callback: () => { data.fixedExpenses = data.fixedExpenses.filter(item => item.id !== fixed.id); rerenderAfterChange({ toast: 'Charge fixe supprimée.' }); } }); return; }
    if (target.dataset.resetBudget) {
      const categoryId = target.dataset.resetBudget;
      if (data.budgetOverrides?.[selectedMonth]) {
        delete data.budgetOverrides[selectedMonth][categoryId];
        if (!Object.keys(data.budgetOverrides[selectedMonth]).length) delete data.budgetOverrides[selectedMonth];
      }
      rerenderAfterChange({ toast: 'Budget récurrent rétabli.' });
      return;
    }
    if (target.dataset.removeBudget) {
      const categoryId = target.dataset.removeBudget;
      const recurring = data.budgets[categoryId];
      delete data.budgets[categoryId];
      rerenderAfterChange({
        toast: 'Budget supprimé.',
        toastUndo: {
          label: 'Annuler',
          callback: () => {
            if (recurring !== undefined) data.budgets[categoryId] = recurring;
            rerenderAfterChange({ toast: 'Budget restauré.' });
          }
        }
      });
      return;
    }
    if (target.hasAttribute('data-copy-previous-budgets')) {
      const before = data.budgetOverrides?.[selectedMonth] ? { ...data.budgetOverrides[selectedMonth] } : null;
      const previous = previousMonthKey();
      const ids = new Set([...Object.keys(data.budgets || {}), ...Object.keys(data.budgetOverrides?.[previous] || {})]);
      if (!ids.size) { showToast('Aucun budget à reprendre pour le moment.', 'negative'); return; }
      data.budgetOverrides[selectedMonth] = {};
      ids.forEach(categoryId => {
        const value = budgetAmount(categoryId, previous);
        if (value > 0) data.budgetOverrides[selectedMonth][categoryId] = value;
      });
      rerenderAfterChange({
        toast: 'Plan du mois précédent repris.',
        toastUndo: {
          label: 'Annuler',
          callback: () => {
            if (before && Object.keys(before).length) data.budgetOverrides[selectedMonth] = before;
            else delete data.budgetOverrides[selectedMonth];
            rerenderAfterChange({ toast: 'Plan précédent annulé.' });
          }
        }
      });
      return;
    }
    if (target.hasAttribute('data-export')) { exportData(); return; }
    if (target.hasAttribute('data-clear-data')) { openConfirm({ title: 'Tout supprimer ?', copy: 'Cette action ne peut pas être annulée. Pensez à exporter vos données si vous souhaitez les garder.', danger: true, strong: true, callback: () => { data = { ...emptyData(), initialized: true }; selectedMonth = monthKey(); closeModal(); rerenderAfterChange({ toast: 'Toutes vos données ont été supprimées.' }); } }); return; }
    if (target.hasAttribute('data-confirm-action') && !target.disabled && confirmCallback) { const callback = confirmCallback; closeModal(); callback(); return; }
    if (target.hasAttribute('data-toast-undo') && toastAction?.callback) { const callback = toastAction.callback; $('#toast-root').innerHTML = ''; toastAction = null; callback(); return; }
    if (target.dataset.fillName !== undefined) { const input = $('.modal [name="name"]'); if (input) { input.value = target.dataset.fillName; input.focus(); } return; }
    if (target.dataset.setCategory) { const select = $('.modal [name="categoryId"]'); if (select) { select.value = target.dataset.setCategory; $('#smart-suggestion').innerHTML = ''; } return; }
    if (target.classList.contains('settings-trigger')) { openSettings(); }
  });

  document.addEventListener('submit', event => {
    const form = event.target;
    if (form.matches('[data-transaction-form]')) { event.preventDefault(); submitTransaction(form); }
    if (form.matches('[data-budget-form]')) {
      event.preventDefault();
      const body = new FormData(form);
      const amount = numberValue(body.get('amount'));
      if (amount <= 0) { showToast('Indiquez un budget supérieur à 0 €.', 'negative'); return; }
      const categoryId = body.get('categoryId');
      if (body.get('scope') === 'month') {
        data.budgetOverrides[selectedMonth] ||= {};
        data.budgetOverrides[selectedMonth][categoryId] = amount;
      } else {
        data.budgets[categoryId] = amount;
      }
      closeModal(); rerenderAfterChange({ toast: body.get('scope') === 'month' ? 'Ajustement du mois ajouté.' : 'Budget mensuel ajouté.' });
    }
    if (form.matches('[data-fixed-form]')) {
      event.preventDefault();
      const body = new FormData(form);
      const amount = numberValue(body.get('amount'));
      const name = String(body.get('name') || '').trim();
      if (!name || amount <= 0) { showToast('Ajoutez un nom et un montant valide.', 'negative'); return; }
      const fixed = { id: modalState?.fixedId || uid('fixed'), name, amount, categoryId: body.get('categoryId'), day: Math.max(1, Math.min(31, Number(body.get('day')) || 1)) };
      const index = data.fixedExpenses.findIndex(item => item.id === fixed.id);
      if (index >= 0) data.fixedExpenses[index] = fixed; else data.fixedExpenses.push(fixed);
      const editing = index >= 0;
      closeModal(); rerenderAfterChange({ toast: editing ? 'Charge fixe modifiée.' : 'Charge fixe ajoutée.' });
    }
    if (form.matches('[data-savings-goal]')) {
      event.preventDefault();
      data.savingsGoal = numberValue(new FormData(form).get('goal'));
      rerenderAfterChange({ toast: data.savingsGoal ? 'Objectif d’épargne enregistré.' : 'Objectif retiré.' });
    }
  });

  document.addEventListener('input', event => {
    if (event.target.matches('.modal [name="name"]') && $('.modal [name="type"]')?.value === 'expense') updateSmartSuggestion(event.target);
    if (event.target.id === 'history-search') {
      historyQuery = event.target.value.trim().toLowerCase();
      updateHistoryResults();
    }
    if (event.target.id === 'strong-confirmation') { const button = $('[data-confirm-action]'); if (button) button.disabled = event.target.value.trim().toUpperCase() !== 'SUPPRIMER'; }
  });
  document.addEventListener('change', event => {
    if (event.target.matches('.modal [name="categoryId"]')) $('.custom-category-wrap')?.classList.toggle('visible', event.target.value === '__new__');
    if (event.target.id === 'history-filter') { historyKind = event.target.value; updateHistoryResults(); }
    if (event.target.id === 'history-month') { historyMonth = event.target.value; updateHistoryResults(); }
    if (event.target.id === 'history-category') { historyCategory = event.target.value; updateHistoryResults(); }
    if (event.target.matches('[data-budget-input]')) {
      const amount = numberValue(event.target.value);
      const id = event.target.dataset.budgetInput;
      if (amount > 0) {
        data.budgetOverrides[selectedMonth] ||= {};
        data.budgetOverrides[selectedMonth][id] = amount;
        rerenderAfterChange({ toast: 'Budget ajusté pour ce mois.' });
      } else {
        data.budgetOverrides[selectedMonth] ||= {};
        data.budgetOverrides[selectedMonth][id] = 0;
        rerenderAfterChange({ toast: 'Budget désactivé pour ce mois.' });
      }
    }
    if (event.target.id === 'import-file') importData(event.target.files?.[0]);
  });

  $('#start-app').addEventListener('click', () => {
    const amount = numberValue($('#initial-balance').value);
    data.initialized = true;
    data.openingBalance = amount;
    data.openingBalanceDate = today();
    save();
    $('#onboarding').hidden = true;
    render();
  });
  $('#skip-onboarding').addEventListener('click', () => { data.initialized = true; save(); $('#onboarding').hidden = true; render(); });

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && modalState) { closeModal(); return; }
    if (event.key === 'Tab' && modalState) {
      const focusable = $$('.modal button:not([disabled]), .modal input:not([disabled]), .modal select:not([disabled]), .modal [tabindex]:not([tabindex="-1"])');
      if (focusable.length) {
        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      }
    }
    if (event.key === '+' && !modalState && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) openTransaction({ type: 'expense' });
  });

  window.addEventListener('storage', event => {
    if (event.key === THEME_KEY) {
      themePreference = THEMES.includes(event.newValue) ? event.newValue : 'system';
      applyTheme();
      return;
    }
    if (event.key !== STORAGE_KEY || !event.newValue) return;
    data = load();
    render();
    showToast('Vos données ont été mises à jour dans un autre onglet.');
  });

  window.matchMedia?.('(prefers-color-scheme: dark)').addEventListener?.('change', () => {
    if (themePreference === 'system') applyTheme();
  });
  applyTheme();
  render();
  if (!data.initialized) $('#onboarding').hidden = false;
})();

</script>
  </body>
</html>
