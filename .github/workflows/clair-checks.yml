name: Clair code checks
on:
  push:
    branches: [main, clair-dashboard-savings-20261019, clair-ruban-history-20261019, clair-welcome-ruban-20261019, clair-subscriptions-reminders-20261021, clair-ruban-splash-20261021, clair-navigation-back-20261022, clair-currency-20261022, clair-convert-20261023, clair-profile-tutorial-20261023]
    paths:
      - 'clair/**'
      - 'masterboard/**'
      - 'supabase/**'
      - '.github/workflows/clair-checks.yml'
  pull_request:
    paths:
      - 'clair/**'
      - 'masterboard/**'
      - 'supabase/**'
      - '.github/workflows/clair-checks.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run Clair regression suites
        shell: bash
        run: |
          set -euo pipefail
          node --version
          for test in clair/accounts/test-*.cjs; do
            echo "Running $test"
            node "$test"
          done

      - name: Install pinned browser test tool
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/clair-tools" --no-save --ignore-scripts playwright@1.64.1
      - name: Check browser layouts and savings flows
        shell: bash
        env:
          CLAIR_CHROME_PATH: /usr/bin/google-chrome
          CLAIR_PREVIEW: '1'
        run: |
          NODE_PATH="$RUNNER_TEMP/clair-tools/node_modules" node clair/accounts/verify-profile.cjs
          NODE_PATH="$RUNNER_TEMP/clair-tools/node_modules" node clair/accounts/verify-masterboard.cjs
          NODE_PATH="$RUNNER_TEMP/clair-tools/node_modules" node clair/accounts/verify-assisted-recovery.cjs
          NODE_PATH="$RUNNER_TEMP/clair-tools/node_modules" node clair/accounts/verify-exchange.cjs
          NODE_PATH="$RUNNER_TEMP/clair-tools/node_modules" node clair/accounts/verify-currency.cjs
          NODE_PATH="$RUNNER_TEMP/clair-tools/node_modules" node clair/accounts/verify-sounds.cjs
          NODE_PATH="$RUNNER_TEMP/clair-tools/node_modules" node clair/accounts/verify-navigation.cjs
          NODE_PATH="$RUNNER_TEMP/clair-tools/node_modules" node clair/accounts/verify-startup-session.cjs
          NODE_PATH="$RUNNER_TEMP/clair-tools/node_modules" node clair/accounts/verify-browser.cjs
          NODE_PATH="$RUNNER_TEMP/clair-tools/node_modules" node clair/accounts/verify-journal.cjs
          NODE_PATH="$RUNNER_TEMP/clair-tools/node_modules" node clair/accounts/verify-welcome.cjs
          NODE_PATH="$RUNNER_TEMP/clair-tools/node_modules" node clair/accounts/verify-subscriptions.cjs

  masterboard-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: clair_masterboard_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify isolated admin permissions, free phase and test renewals
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: clair_masterboard_test_only
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon; create role authenticated; create role service_role bypassrls;
          create schema auth;
          create table auth.users(id uuid primary key,email text,banned_until timestamptz);
          create function auth.uid() returns uuid language sql stable as $$
            select (nullif(current_setting('request.jwt.claims',true),'')::jsonb->>'sub')::uuid;
          $$;
          grant usage on schema auth to authenticated;
          SQL
          psql -v ON_ERROR_STOP=1 -f clair/accounts/schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase/masterboard.sql
          psql -v ON_ERROR_STOP=1 -f supabase/verify-masterboard.sql
          psql -v ON_ERROR_STOP=1 -f supabase/account-help.sql
          psql -v ON_ERROR_STOP=1 -f supabase/verify-account-help.sql
          psql -v ON_ERROR_STOP=1 -f supabase/recovery-request-limits.sql
          psql -v ON_ERROR_STOP=1 -f supabase/verify-recovery-request-limits.sql

  reminders-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: clair_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check reminder permissions, claims, retries and account cleanup
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: clair_test_only
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' > "$RUNNER_TEMP/clair-reminders-test.sql"
          const fs=require('node:fs');
          console.log('create role anon; create role authenticated; create role service_role bypassrls; create schema auth; create table auth.users(id uuid primary key);');
          const sql=fs.readFileSync('supabase/reminders.sql','utf8').split('-- UTC cron')[0].replace(/^create extension.*$/gm,'');
          console.log(sql);
          NODE
          psql -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/clair-reminders-test.sql"
          psql -v ON_ERROR_STOP=1 -f supabase/verify-reminders.sql
          psql -v ON_ERROR_STOP=1 -f clair/accounts/verify-currency.sql
          psql -v ON_ERROR_STOP=1 -f clair/accounts/verify-exchange.sql
          CLAIR_SQL_VECTORS=1 node clair/accounts/test-exchange.cjs > "$RUNNER_TEMP/clair-exchange-vectors.sql"
          psql -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/clair-exchange-vectors.sql"
