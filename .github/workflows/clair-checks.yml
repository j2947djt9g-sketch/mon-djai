name: Clair code checks
on:
  push:
    branches: [main]
    paths:
      - 'clair/**'
      - '.github/workflows/clair-checks.yml'
  pull_request:
    paths:
      - 'clair/**'
      - '.github/workflows/clair-checks.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run Clair regression suites
        shell: bash
        run: |
          set -euo pipefail
          node --version
          for test in clair/accounts/test-*.cjs; do
            echo "Running $test"
            node "$test"
          done
