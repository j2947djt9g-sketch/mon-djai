name: Verify explicit Clair Vercel publication (manual, no deployment)
on:
  workflow_dispatch:
    inputs:
      delivery_commit:
        description: 'Exact reviewed delivery commit (40 hexadecimal characters)'
        required: true
        type: string
      vercel_origin:
        description: 'Explicit HTTPS Vercel origin, e.g. https://project.vercel.app'
        required: true
        type: string
permissions:
  contents: read
jobs:
  published-files:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Validate explicit delivery identity
        env:
          DELIVERY_COMMIT: ${{ inputs.delivery_commit }}
        run: '[[ "$DELIVERY_COMMIT" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.delivery_commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
      - name: Reconstruct and verify chosen commit, then compare explicit Vercel domain
        env:
          DELIVERY_COMMIT: ${{ inputs.delivery_commit }}
          VERCEL_ORIGIN: ${{ inputs.vercel_origin }}
        run: |
          node tools/clair/build.mjs --check
          node tools/clair/package.mjs --ref "$DELIVERY_COMMIT" --out "$RUNNER_TEMP/clair-package"
          node tools/clair/verify-package.mjs --ref "$DELIVERY_COMMIT" --out "$RUNNER_TEMP/clair-package"
          node tools/clair/verify-live.mjs --domain "$VERCEL_ORIGIN" --ref "$DELIVERY_COMMIT" --manifest "$RUNNER_TEMP/clair-package/clair-package-manifest.json"
