<!doctype html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e9f1ee">
  <meta name="description" content="Clair Scolaire : organise tes études sans pression et suis ta progression quotidienne.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Clair Scolaire">
  <title>Clair Scolaire · Un jour à la fois</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css?v=2.1">
  <script src="./app.js?v=2.1" defer></script>
</head>
<body>
  <svg class="svg-sprites" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-8h6v8"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V11m6 9V5m6 15v-8m5 8H2"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06-2 2-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21h-3v-.09a1.7 1.7 0 0 0-1-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06-2-2 .06-.06A1.7 1.7 0 0 0 7.34 15a1.7 1.7 0 0 0-1.56-1H5v-3h.78a1.7 1.7 0 0 0 1.56-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06 2-2 .06.06a1.7 1.7 0 0 0 1.87.34A1.7 1.7 0 0 0 11.87 5V4h3v1a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06 2 2-.06.06A1.7 1.7 0 0 0 19.4 10a1.7 1.7 0 0 0 1.56 1H21v3h-.04A1.7 1.7 0 0 0 19.4 15Z" transform="translate(-.8 -.5)"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m3 0-1 14H7L6 7m4 4v6m4-6v6"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.8 13A9 9 0 0 1 11 3.2 9 9 0 1 0 20.8 13Z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 17V5m-5 5 5-5 5 5M4 17v4h16v-4"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M4 17l-1 4 4-1L19 8l-3-3Z"/></symbol>
  </svg>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navigation">
      <a class="brand" href="#aujourdhui" aria-label="Clair Scolaire, accueil"><span class="brand-mark">C<span class="brand-dot"></span></span><span>clair<span class="brand-small">scolaire</span></span></a>
      <div class="sidebar-caption">Un jour à la fois, à ton rythme.</div>
      <nav class="side-nav" id="side-nav">
        <button type="button" class="nav-item active" data-view="today"><svg><use href="#i-home"/></svg> Aujourd'hui</button>
        <button type="button" class="nav-item" data-view="week"><svg><use href="#i-calendar"/></svg> Ma semaine</button>
        <button type="button" class="nav-item" data-view="stats"><svg><use href="#i-chart"/></svg> Progression</button>
        <button type="button" class="nav-item" data-view="settings"><svg><use href="#i-settings"/></svg> Réglages</button>
      </nav>
      <div class="sidebar-footer"><span class="sidebar-pill">✦ Petits pas, vrais progrès</span><p>Ton espace d'études, sans heures imposées.</p></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <a class="mobile-logo" href="#aujourdhui"><span class="brand-mark">C<span class="brand-dot"></span></span> clair <small>scolaire</small></a>
        <div class="topbar-right"><span class="topbar-date" id="topbar-date"></span><button type="button" class="round-btn" data-action="toggle-theme" aria-label="Changer de thème"><svg><use href="#i-moon"/></svg></button></div>
      </header>
      <div id="main-view" aria-live="polite"></div>
      <footer class="page-footer">Clair Scolaire · Ton temps, ton rythme, tes progrès.</footer>
    </main>
  </div>
  <nav class="bottom-nav" id="bottom-nav" aria-label="Navigation mobile">
    <button type="button" class="active" data-view="today"><svg><use href="#i-home"/></svg><span>Aujourd'hui</span></button>
    <button type="button" data-view="week"><svg><use href="#i-calendar"/></svg><span>Semaine</span></button>
    <button type="button" data-view="stats"><svg><use href="#i-chart"/></svg><span>Progrès</span></button>
    <button type="button" data-view="settings"><svg><use href="#i-settings"/></svg><span>Réglages</span></button>
  </nav>
  <dialog id="task-dialog" class="task-dialog" aria-labelledby="dialog-title">
    <form id="task-form" method="dialog">
      <div class="dialog-head"><div><span class="eyebrow">À TON RYTHME</span><h2 id="dialog-title">Ajouter une tâche</h2></div><button type="button" class="round-btn" data-action="close-dialog" aria-label="Fermer">×</button></div>
      <label class="field">Que veux-tu travailler ?<input id="task-name" name="name" placeholder="Ex. 20 questions TOEIC" maxlength="110" required></label>
      <label class="field">Matière<select id="task-subject" name="subject"><option value="english">Anglais / TOEIC</option><option value="macro">Macroéconomie</option><option value="excel">Excel</option><option value="sap">SAP</option><option value="other">Autre</option></select></label>
      <div class="dialog-grid"><label class="field">Période<select id="task-period" name="period"><option value="morning">Matin</option><option value="afternoon">Après-midi</option><option value="evening">Soir</option></select></label><label class="field">Durée indicative (min)<input id="task-duration" name="duration" type="number" min="5" max="240" step="5" value="30" required></label></div>
      <p class="field-hint">La durée est un repère, jamais une obligation.</p>
      <div class="dialog-buttons"><button type="button" class="btn btn-light" data-action="close-dialog">Annuler</button><button type="submit" class="btn btn-primary">Enregistrer <svg><use href="#i-check"/></svg></button></div>
    </form>
  </dialog>
  <input id="import-file" type="file" accept=".json,application/json" hidden aria-label="Importer une sauvegarde">
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
