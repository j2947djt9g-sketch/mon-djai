# Authentication is performed inside the handler: user JWT for device routes,
# private cron secret for dispatch. No route accepts the public API key as identity.
[functions.clair-reminders]
verify_jwt = false

# Validates the user token against Auth and the live private admin allowlist.
[functions.clair-masterboard]
verify_jwt = false

# Rate-limited public support inbox; returns no account information.
[functions.clair-account-help]
verify_jwt = false
