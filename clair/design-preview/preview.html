<!doctype html>
<html lang="fr"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>CLAIR — maquette interactive</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="theme-glass.css"><link rel="stylesheet" href="theme-express.css"><link rel="stylesheet" href="theme-contrast.css"></head>
<body><div class="app" data-style="glass"><div class="prototype-note">Proposition à valider <span>·</span> Données fictives</div><header class="app-header"><a class="brand" href="?style=glass" aria-label="Clair, accueil de la maquette"><img src="../icons/icon.svg" alt="" width="31" height="31"><span>clair</span></a><div class="header-tools"><button class="icon-button" data-action="notifications" aria-label="Notifications" data-icon="bell"></button><button class="avatar-button" data-action="profile" aria-label="Mon profil">A</button></div></header><main id="content"></main><nav class="bottom-dock" aria-label="Navigation principale"><span class="nav-highlight" aria-hidden="true"></span><button class="nav-item is-active" data-page="home"><span class="nav-icon" data-icon="home"></span><span class="nav-label">Accueil</span></button><button class="nav-item" data-page="history"><span class="nav-icon" data-icon="history"></span><span class="nav-label">Historique</span></button><button class="nav-express" data-action="express" aria-label="Dépense Express"><span data-icon="plus"></span><span class="quick-label">Express</span></button><button class="nav-item" data-page="settings"><span class="nav-icon" data-icon="settings"></span><span class="nav-label">Réglages</span></button></nav>
<dialog class="demo-sheet" id="express-sheet"><div class="sheet-handle"></div><div class="sheet-title"><div><span class="eyebrow">UN GESTE, C’EST NOTÉ</span><h2>Dépense Express</h2></div><button class="icon-button" data-action="close-sheet" aria-label="Fermer" data-icon="close"></button></div><p class="sheet-help">Une simulation, pour essayer le geste.</p><form id="demo-form"><label class="amount-label" for="demo-amount">Montant en dirhams</label><div class="amount-wrap"><input class="amount-input" id="demo-amount" inputmode="decimal" autocomplete="off" placeholder="0,00" required aria-describedby="amount-error"><span>MAD</span></div><p class="amount-error" id="amount-error" role="alert"></p><div class="amount-shortcuts"><button type="button" data-amount="15">15 MAD</button><button type="button" data-amount="30">30 MAD</button><button type="button" data-amount="50">50 MAD</button></div><p class="sheet-help">Aujourd’hui · Non classée</p><button class="button primary-action" type="submit"><span data-icon="check"></span>Tester l’enregistrement</button><p class="demo-disclaimer">Données fictives. Aucune vraie dépense enregistrée.</p></form></dialog>
<dialog class="demo-sheet detail-sheet" id="detail-sheet"><div class="sheet-handle"></div><div class="sheet-title"><h2 id="detail-title"></h2><button class="icon-button" data-action="close-detail" aria-label="Fermer" data-icon="close"></button></div><div id="detail-content"></div></dialog><div class="toast" role="status" aria-live="polite"></div></div><script src="demo.js"></script></body></html>
